name: Desktop Windows Build

on:
  push:
    branches:
      - '**'
    tags:
      - 'desktop-v*'
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release for the current desktop-v* tag
        required: true
        default: false
        type: boolean
      replace_existing:
        description: Explicitly replace an existing release and its assets
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    outputs:
      desktop_version: ${{ steps.metadata.outputs.desktop_version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Validate desktop tag
        id: metadata
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          $version = node -p "require('./desktop/package.json').version"
          $isTagRelease = $env:REF_TYPE -eq 'tag' -and $env:REF_NAME -like 'desktop-v*'
          $isManualRelease = $env:PUBLISH_INPUT -eq 'true'
          if ($isManualRelease -and -not $isTagRelease) {
            throw 'workflow_dispatch 发布必须从 desktop-v<version> tag 运行。'
          }
          if ($isTagRelease) {
            $tagVersion = $env:REF_NAME.Substring('desktop-v'.Length)
            if ([string]::IsNullOrWhiteSpace($tagVersion) -or $tagVersion -ne $version) {
              throw "Tag $($env:REF_NAME) 与 desktop/package.json 版本 $version 不一致。"
            }
          }
          "DESKTOP_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=$($env:REF_NAME)" >> $env:GITHUB_ENV
          "desktop_version=$version" >> $env:GITHUB_OUTPUT

      - name: Install web dependencies
        working-directory: web
        run: npm.cmd ci --legacy-peer-deps

      - name: Verify web build tool
        working-directory: web
        shell: pwsh
        run: |
          node --version
          npm --version
          if (-not (Test-Path 'node_modules/.bin/vite.cmd')) {
            throw 'Vite executable was not installed.'
          }
          npm.cmd exec -- vite --version

      - name: Build web assets
        working-directory: web
        shell: cmd
        env:
          LOTUS_DESKTOP_BUILD: '1'
        run: |
          node --max-old-space-size=8192 node_modules/vite/bin/vite.js build > build.log 2>&1
          if errorlevel 1 (type build.log & exit /b 1)

      - name: Upload web build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lotus-canvas-web-build-log-${{ github.run_id }}
          path: web/build.log
          if-no-files-found: warn

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm.cmd ci

      - name: Test desktop
        working-directory: desktop
        run: npm.cmd test

      - name: Build unsigned Electron packages
        working-directory: desktop
        run: npm.cmd run build

      - name: Create portable package
        working-directory: desktop
        run: npm.cmd run package:portable

      - name: Generate SHA-256 checksums
        working-directory: desktop
        run: npm.cmd run checksums

      - name: Upload validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lotus-canvas-desktop-${{ env.DESKTOP_VERSION }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/latest.yml
            desktop/release/*.blockmap
            desktop/release/SHA256SUMS.txt

  publish:
    if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.publish == true
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      DESKTOP_VERSION: ${{ needs.build.outputs.desktop_version }}
      RELEASE_TAG: ${{ github.ref_name }}
      DESKTOP_REPLACE_EXISTING: ${{ inputs.replace_existing == true && inputs.publish == true }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: lotus-canvas-desktop-${{ needs.build.outputs.desktop_version }}
          path: release

      - name: Publish unsigned GitHub Release
        shell: pwsh
        run: |
          $assets = Get-ChildItem release -File | Where-Object { $_.Extension -in @('.exe', '.zip', '.blockmap') -or $_.Name -in @('latest.yml', 'SHA256SUMS.txt') }
          $assetPaths = @($assets | ForEach-Object { $_.FullName })
          $releaseNotes = "Windows desktop release $env:DESKTOP_VERSION. 当前产物未使用 Authenticode 代码签名，Windows 可能显示未知发布者或 SmartScreen 提示。NSIS 安装版会检测更新，用户确认后下载并重启安装；绿色版请退出应用后替换程序文件并保留 exe 同级 data/。"
          gh release view $env:RELEASE_TAG --repo $env:REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            if ($env:DESKTOP_REPLACE_EXISTING -ne 'true') {
              throw "Release $env:RELEASE_TAG 已存在；如需覆盖，请通过 workflow_dispatch 显式启用 replace_existing。"
            }
            foreach ($asset in $assets) {
              gh release delete-asset $env:RELEASE_TAG $asset.Name --repo $env:REPOSITORY --yes 2>$null
            }
            gh release upload $env:RELEASE_TAG --repo $env:REPOSITORY $assetPaths
            gh release edit $env:RELEASE_TAG --repo $env:REPOSITORY --title "lotus-canvas Desktop $env:DESKTOP_VERSION" --notes $releaseNotes
          } else {
            gh release create $env:RELEASE_TAG --repo $env:REPOSITORY --title "lotus-canvas Desktop $env:DESKTOP_VERSION" --notes $releaseNotes $assetPaths
          }
